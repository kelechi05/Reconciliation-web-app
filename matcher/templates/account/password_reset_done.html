{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Password reset sent</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'matcher/styles.css' %}">
</head>
<body class="auth-reset-page">
    <nav class="site-nav">
        <a href="{% url 'account_login' %}" class="brand">
            <span class="logo-mark">ER</span>
            <span>Easy-RecoNow</span>
        </a>
        <ul class="nav-links">
            <li><a href="{% url 'account_login' %}">Sign in</a></li>
            <li><a href="{% url 'account_signup' %}">Register</a></li>
        </ul>
    </nav>

    <main class="reset-layout reset-done-layout">
        <section class="auth-shell reset-shell">
            <div class="form-heading">
                <span class="logo-mark">ER</span>
                <h2>Check your email</h2>
            </div>

            <p class="reset-help reset-confirmation">
                We have sent password reset instructions if an account exists for that email address.
                Please check your inbox and spam folder.
            </p>

            <a href="{% url 'account_login' %}" class="btn btn-primary">Back to sign in</a>
        </section>
    </main>
</body>
</html>
